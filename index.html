<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cadybara</title>

  <link rel="icon" type="image/png" href="icon-bg.png" />
  <link rel="apple-touch-icon" href="icon-bg.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- LEFT: editor -->
    <section class="editor-pane">
      <header class="pane-header">
        <span class="title">
          <img src="icon-bg.png" alt="" class="logo" />
          cadybara
        </span>
        <div class="header-actions">
          <button class="btn" id="helpBtn" title="syntax reference">? help</button>
          <button class="btn" id="exportSvgBtn" title="download SVG">⬇ svg</button>
          <button class="btn" id="exportPngBtn" title="download PNG">⬇ png</button>
          <button class="btn" id="resetBtn" title="reset to example">⟲ reset</button>
          <button class="btn primary" id="autoRenderBtn" title="toggle auto-render">🟢 auto</button>
        </div>
      </header>

      <div class="editor-wrap">
        <textarea id="codeEditor" spellcheck="false" placeholder="write pseudo‑CAD commands..."></textarea>
        <div id="intellisense"></div>
      </div>

      <footer class="status-bar">
        <span id="statusMsg" class="ok">ready</span>
        <span class="status-right" id="statusRight">zoom 100% · 0 shapes</span>
      </footer>
    </section>

    <!-- RIGHT: canvas -->
    <section class="canvas-pane">
      <header class="pane-header">
        <span class="title">🖌️ viewport</span>
        <div class="header-actions">
          <span class="badge" id="viewBadge">100%</span>
          <button class="btn" id="fitBtn" title="fit view (Ctrl+0)">⊡ fit</button>
        </div>
      </header>
      <div class="canvas-container" id="canvasContainer">
        <canvas id="cadCanvas" width="800" height="800"></canvas>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="helpModal">
    <div class="modal">
      <div class="modal-header">
        <span>📖 cadybara syntax reference</span>
        <button class="btn" id="closeHelpBtn">✕ close</button>
      </div>
      <div class="modal-body" id="helpBody">
        <p style="color:#888;font-size:0.85rem">loading syn.json…</p>
      </div>
      <div class="modal-footer">
        <button class="btn" id="closeHelpBtn2">close</button>
      </div>
    </div>
  </div>

  <script src="parser.js"></script>
  <script src="cad.js"></script>
  <script src="export.js"></script>
  <script src="storage.js"></script>
  <script src="script.js"></script>
  <script>

  </script>
</body>
</html>
