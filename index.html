<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Basic SEO -->
  <title>cadybara — A Tiny CAD Pseudo-Language for the Web</title>
  <meta name="description" content="Write code. See shapes. cadybara is a live pseudo-CAD language on the web. Built with vanilla JS, no build step required. Pan, zoom, and export instantly.">
  <meta name="author" content="mkrm0000">
  <meta name="theme-color" content="#1a1a1a">
  <link rel="canonical" href="https://mkrm0000.github.io/cadybara/">

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="icon-bg.png" />
  <link rel="apple-touch-icon" href="icon-bg.png" />

  <!-- Open Graph / Facebook / LinkedIn / Discord -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="cadybara">
  <meta property="og:url" content="https://mkrm0000.github.io/cadybara/">
  <meta property="og:title" content="cadybara — A Tiny CAD Pseudo-Language for the Web">
  <meta property="og:description" content="A live pseudo-CAD REPL for 2D drawings. Write code, see shapes. No frameworks, just vanilla JS.">
  <meta property="og:image" content="https://mkrm0000.github.io/cadybara/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="cadybara logo with the text 'Tiny CAD on the Web'">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://mkrm0000.github.io/cadybara/">
  <meta name="twitter:title" content="cadybara — A Tiny CAD Pseudo-Language for the Web">
  <meta name="twitter:description" content="A live pseudo-CAD REPL for 2D drawings. Write code, see shapes. No frameworks, just vanilla JS.">
  <meta name="twitter:image" content="https://mkrm0000.github.io/cadybara/og-image.png">
  <meta name="twitter:image:alt" content="cadybara logo with the text 'Tiny CAD on the Web'">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- LEFT: editor -->
    <section class="editor-pane">
      <header class="pane-header">
        <span class="title">
          <img src="icon-bg.png" alt="" class="logo" />
          cadybara
        </span>
        <div class="header-actions">
          <button class="btn" id="helpBtn" title="syntax reference">? help</button>
          <button class="btn" id="exportSvgBtn" title="download SVG">⬇ svg</button>
          <button class="btn" id="exportPngBtn" title="download PNG">⬇ png</button>
          <button class="btn" id="resetBtn" title="reset to example">⟲ reset</button>
          <button class="btn primary" id="autoRenderBtn" title="toggle auto-render">🟢 auto</button>
        </div>
      </header>

      <div class="editor-wrap">
        <textarea id="codeEditor" spellcheck="false" placeholder="write pseudo‑CAD commands..."></textarea>
        <div id="intellisense"></div>
      </div>

      <footer class="status-bar">
        <span id="statusMsg" class="ok">ready</span>
        <span class="status-right" id="statusRight">zoom 100% · 0 shapes</span>
      </footer>
    </section>

    <!-- RIGHT: canvas -->
    <section class="canvas-pane">
      <header class="pane-header">
        <span class="title">🖌️ viewport</span>
        <div class="header-actions">
          <span class="badge" id="viewBadge">100%</span>
          <button class="btn" id="fitBtn" title="fit view (Ctrl+0)">⊡ fit</button>
        </div>
      </header>
      <div class="canvas-container" id="canvasContainer">
        <canvas id="cadCanvas" width="800" height="800"></canvas>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="helpModal">
    <div class="modal">
      <div class="modal-header">
        <span>📖 cadybara syntax reference</span>
        <button class="btn" id="closeHelpBtn">✕ close</button>
      </div>
      <div class="modal-body" id="helpBody">
        <p style="color:#888;font-size:0.85rem">loading syn.json…</p>
      </div>
      <div class="modal-footer">
        <button class="btn" id="closeHelpBtn2">close</button>
      </div>
    </div>
  </div>

  <script src="parser.js"></script>
  <script src="cad.js"></script>
  <script src="export.js"></script>
  <script src="storage.js"></script>
  <script src="script.js"></script>
  <script src="logoPopup.js"></script>
  <script>

  </script>
</body>
</html>
